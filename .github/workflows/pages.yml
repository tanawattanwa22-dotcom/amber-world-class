name: Deploy AMBER WORLD CLASS to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: amber-world-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser JavaScript\n        run: |\n          node --check public/game.js\n          node --check public/config.js\n          test -s public/index.html\n          test -f public/assets/maps/map-10.png\n          test -f public/assets/sprites/hero-3.png\n      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
