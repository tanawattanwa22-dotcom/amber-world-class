name: Deploy AMBER WORLD CLASS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/generate_assets_v04.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: amber-world-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build original pixel-art assets (V0.4)
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python tools/generate_assets_v04.py
          python - <<'PY'
          from pathlib import Path
          base=Path('public/assets')
          images=list(base.rglob('*.png'))
          assert len(images)>=28, f'expected at least 28 sprites/maps, got {len(images)}'
          assert (base/'effects/skill-0.png').is_file()
          print(f'Assets compiled: {len(images)} PNG')
          PY

      - name: Validate game files
        shell: bash
        run: |
          node --check public/game.js
          node --check public/config.js
          test -s public/index.html
          test -f public/assets/maps/map-10.png
          test -f public/assets/sprites/hero-3.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
