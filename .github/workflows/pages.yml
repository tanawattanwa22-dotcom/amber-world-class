name: Deploy AMBER WORLD CLASS to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/upgrade_assets_v05.py'
      - 'tools/verify_asset_frames_v05.py'
      - 'tools/verify_hd_sword_v08.py'
      - 'tools/build_sprite_full_v07.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: amber-world-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate versioned V0.5 sprite atlases without overwriting committed artwork
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base=Path('public/assets')
          expected={**{f'maps/map-{i:02d}.png':(1152,1152) for i in range(1,11)},
                    **{f'sprites/boss-{i:02d}.png':(192,384) for i in range(10)},
                    **{f'sprites/wing-{i}.png':(192,384) for i in range(4)},
                    **{f'effects/skill-{i}.png':(384,384) for i in range(4)},
                    **{f'sprites/hero-{i}.png':(192,384) for i in range(4)},
                    **{f'sprites/mob-{i}.png':(192,384) for i in range(10)},
                    'ui/interface-icons-v05.png':(384,256)}
          for rel,size in expected.items():
            file=base/rel
            assert file.exists(), f'missing asset: {file}'
            with Image.open(file) as im:
              assert im.size == size, f'bad frame grid: {file}: {im.size} != {size}'
          print('Validated',len(expected),'unchanged asset PNG files')
          PY
          python tools/verify_asset_frames_v05.py
          python tools/verify_hd_sword_v08.py

      - name: Build and validate 202 original V0.7 sprite sheets
        shell: bash
        run: |
          python tools/build_sprite_full_v07.py --out public/assets/v07
          python tools/build_sprite_full_v07.py --out public/assets/v07 --verify
          test -s public/assets/v07/manifest.json
          test -f public/assets/v07/monsters/monster-47.png
          test -f public/assets/v07/skills/skill-3-29.png
          test -f public/assets/v07/heroes/hero-2-die.png
          test -f public/assets/v07/bosses/boss-09.png

      - name: Validate game files
        shell: bash
        run: |
          node --check public/game.js
          node --check public/monster-world/game.js
          node tools/smoke_monster_world.cjs
          node --check public/config.js
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          svg=Path('public/monster-world/creatures-100.svg')
          root=ET.parse(svg).getroot()
          ids=[g.get('id') for g in root.iter() if (g.get('id') or '').startswith('m') and len(g.get('id'))==4]
          assert len(ids)==100 and len(set(ids))==100, f'expected 100 unique creature sprites, got {len(ids)}'
          print('Validated 100 independent creature atlas cells')
          v2=Path('public/monster-world/creatures-100-v2.svg')
          new_root=ET.parse(v2).getroot()
          evolved=[g.get('id') for g in new_root.iter() if (g.get('id') or '').startswith('monster-')]
          assert len(evolved)==100 and len(set(evolved))==100, f'expected 100 distinct evolved SVG cells, got {len(evolved)}'
          print('Validated upgraded 100-creature SVG atlas')
          # V0.3: twelve separate original creature illustrations, not poster crops.
          base=Path('public/monster-world/assets/creatures')
          expected=[base / f'{family}-{stage}.svg' for family in ('flamefox','tidewyrm','verdant') for stage in range(1,5)]
          for item in expected:
              tree=ET.parse(item)
              svg_root=tree.getroot()
              assert svg_root.get('viewBox')=='0 0 512 512', f'Wrong viewBox: {item}'
              assert svg_root.get('width')=='512' and svg_root.get('height')=='512',f'Wrong dimension: {item}'
              assert not any(el.tag.endswith('text') for el in svg_root.iter()),f'Illustration contains text: {item}'
              assert item.stat().st_size>5000,f'Unexpectedly empty illustration: {item}'
          ET.parse('public/monster-world/assets/scenes/sunvale.svg')
          assert Path('public/monster-world/art-v03.html').is_file()
          src=Path('public/monster-world/game.js').read_text()
          assert "ORIGINAL_CREATURE_FAMILIES=['flamefox','tidewyrm','verdant']" in src
          assert "sunvale.svg?v=030" in src
          print('Validated',len(expected),'standalone SVG animal illustrations plus original scene and game bindings')
          PY
          test -s public/index.html
          test -f public/assets/maps/map-10.png
          test -f public/assets/sprites/hero-3.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
