<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body><main id="wrap"><div id="scene" aria-label="ฉากเกม 3D"></div>
<div id="scene-label"><b>AMBERLINGS ONLINE</b><span id="scene-status">กำลังตรวจสอบบัญชี…</span></div>
<div id="login" class="ab-auth"><section class="ab-auth-card">
<div class="ab-login-logo">A</div><h1>AMBERLINGS <em>ONLINE</em></h1>
<p>เกมจับมอนสเตอร์ออนไลน์ · ข้อมูลจริงอยู่บน Supabase</p>
<form id="login-form" autocomplete="on">
<label for="email">อีเมล</label><input id="email" type="email" autocomplete="username" required placeholder="you@email.com">
<label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร">
<button class="ab-auth-primary" type="submit">เข้าสู่ระบบ</button>
<button id="sign-up" type="button">สมัครบัญชีใหม่</button></form>
<div class="ab-auth-or">หรือ</div>
<button id="sign-google" class="ab-google" type="button">G &nbsp;เข้าสู่ระบบด้วย Google</button>
<button id="reset-password" class="ab-reset" type="button">ลืมรหัสผ่าน</button>
<div id="auth-feedback" aria-live="polite" role="status">ต้องล็อกอินด้วยบัญชีจริงก่อนเริ่มเล่น</div>
<small>ไม่มี Guest · ไม่มี AI ผู้เล่นจำลอง · ไม่มีข้อมูลเงินหรือไอเทมฝั่งเครื่อง</small>
</section></div></main></body></html>
